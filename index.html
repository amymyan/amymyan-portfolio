<main id="home-film" class="home-film">
  <p class="home-film-loading">loading film…</p>

  <div class="home-film-stage">
    <div class="home-film-assembly">
        <div class="home-film-viewport">
          <div class="home-film-roll">
          <div class="home-film-track">
            <div class="home-film-edge home-film-edge--top">
              <div class="home-film-sprocket home-film-sprocket--top" aria-hidden="true"></div>
            </div>
            <div class="home-film-strip" aria-live="polite"></div>
            <div class="home-film-edge home-film-edge--bottom">
              <div class="home-film-sprocket home-film-sprocket--bottom" aria-hidden="true"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="home-film-controls">
      <button type="button" class="home-film-transport home-film-transport--prev" aria-label="Previous section">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6V6zm3.5 6 8.5 6V6l-8.5 6z"/></svg>
      </button>
      <button type="button" class="home-film-transport home-film-transport--toggle is-playing" aria-label="Pause filmstrip">
        <svg class="home-film-icon home-film-icon--play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7L8 5z"/></svg>
        <svg class="home-film-icon home-film-icon--pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6V5zm8 0h4v14h-4V5z"/></svg>
      </button>
      <button type="button" class="home-film-transport home-film-transport--next" aria-label="Next section">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6h2v12h-2V6zM6 6l8.5 6L6 18V6z"/></svg>
      </button>
    </div>

    <div class="home-film-credits" aria-label="Artists">
      <svg class="home-film-credits-svg" viewBox="0 0 1200 96" preserveAspectRatio="none" aria-hidden="true">
        <path id="home-credits-path" fill="none" d="M-120,48 C80,14 220,82 380,48 S620,14 820,48 S1020,82 1320,48" />
        <text class="home-film-credits-text">
          <textPath id="home-credits-textpath" href="#home-credits-path" startOffset="0%"></textPath>
        </text>
      </svg>
    </div>
  </div>

  <div class="home-film-grain" aria-hidden="true"></div>
</main>
