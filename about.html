<script>
document.getElementById('year').textContent = new Date().getFullYear();

(function loadAboutPhotos() {
  const photo1 = document.getElementById('about-photo1');
  if (typeof mediaSrc !== 'function' || !photo1) return;

  photo1.src = mediaSrc('assets/about/photo1.png');
  photo1.addEventListener('error', () => {
    const frame = photo1.closest('.about-photo');
    if (frame) frame.hidden = true;
  });
})();
</script>
