  .dot-art{
    position:absolute;
    left:50%;
    top:50%;
    z-index:2;
    clip-path:inset(2px);

    pointer-events:none;
    -webkit-mask-image:linear-gradient(#000,#000), var(--art);
    -webkit-mask-size:100% 100%;
    -webkit-mask-repeat:no-repeat;
    -webkit-mask-composite:xor;
    mask-image:linear-gradient(#000,#000), var(--art);
    mask-size:100% 100%;
    mask-repeat:no-repeat;
    mask-mode:alpha, luminance;
    mask-composite:exclude;

    --art:url("assets/about/stipple-vine.png");

  .dot-cluster{
    --art:url("assets/about/stipple-cluster.png");

    mask-mode:alpha, luminance;
    mask-composite:exclude;

    position:absolute;
    width:1px;
    height:1px;

    pointer-events:none;

    width:min(880px, 88vw);

  }
  .about-frame{
    position:relative;
    z-index:4;

    width:var(--photo);
    max-width:100%;
    min-width:0;
    padding:0;
    background:transparent;
    overflow:visible;
  }
  .stone{
    position:absolute;
    z-index:5;
    pointer-events:none;
    width:var(--s);
    aspect-ratio:1;
    left:var(--x);
    top:var(--y);
    transform:translate(-50%, -50%) rotate(var(--r));
    background:var(--img) center / contain no-repeat;
  }
  .about-frame img{
    display:block;
    width:100%;
    height:auto;
    max-width:100%;
    aspect-ratio:1;
